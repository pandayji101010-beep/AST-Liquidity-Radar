name: Build AST Liquidity Radar APK

on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build installable Android APK
        run: gradle -p android-app :app:assembleDebug

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AST-Liquidity-Radar-Android-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          name: AST Liquidity Radar Android v1.0.${{ github.run_number }}
          body: |
            Installable Android WebView wrapper for the existing AST Liquidity Radar website.

            The dashboard website, design, scanner, and backend are not modified by this Android app.
            Internet access is required because the app loads the live Render website.
          files: android-app/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
