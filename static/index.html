<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b111b">
<title>AST · High-Confidence Market Levels</title>
<style>
:root{color-scheme:dark;--bg:#0b111b;--panel:#121c29;--panel2:#0e1723;--line:#28384b;--text:#edf3f8;--muted:#9aabba;--green:#36c995;--red:#f0717d;--amber:#e8b45d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Arial,Roboto,system-ui,sans-serif}
main{max-width:1040px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 15px;margin-bottom:14px;background:var(--panel);border:1px solid var(--line);border-radius:13px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{display:grid;place-items:center;width:37px;height:37px;border-radius:10px;background:#24384a;color:#fff;font-weight:900;letter-spacing:.04em}
h1{font-size:16px;line-height:1.25;margin:0;font-weight:800}
.subtitle{font-size:11px;color:var(--muted);margin-top:3px}
.connection{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--amber)}
.dot.live{background:var(--green);box-shadow:0 0 9px #36c99577}
.dot.off{background:var(--red)}
.asset-list{display:grid;gap:13px}
.asset{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.asset-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line)}
.market-name{font-size:15px;font-weight:850;letter-spacing:.02em}
.market-price{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:3px}
.pill{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:999px;padding:4px 9px;font-size:10px;font-weight:800;white-space:nowrap;color:var(--muted);background:#101a27}
.pill.buy{color:var(--green);border-color:#24664f;background:#0d2a22}
.pill.sell{color:var(--red);border-color:#71313c;background:#2b121b}
.pill.wait{color:var(--amber);border-color:#72552f;background:#261e12}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:650px}
th{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:750;text-align:left;background:var(--panel2);padding:10px 12px}
td{font-size:12px;padding:11px 12px;border-top:1px solid #213044;vertical-align:middle}
tbody tr:first-child td{border-top:0}
.rank{font-weight:850;color:#dbe7f1}
.side{font-weight:850}
.side.support{color:var(--green)}
.side.resistance{color:var(--red)}
.price,.distance,.score{font-variant-numeric:tabular-nums;font-weight:750}
.score{display:flex;align-items:center;gap:8px}
.score-num{min-width:23px}
.score-track{width:54px;height:5px;border-radius:8px;background:#26364a;overflow:hidden}
.score-fill{height:100%;border-radius:8px;background:#8ca3b8}
.no-trade{padding:20px 15px;text-align:center;color:var(--muted);font-size:12px}
.loading{padding:20px;text-align:center;color:var(--muted)}
footer{padding:13px 3px 3px;color:#8798a9;font-size:10px;text-align:center}
@media(max-width:650px){
 main{padding:9px}
 header{padding:10px 11px;margin-bottom:10px;border-radius:11px}
 h1{font-size:14px}
 .subtitle{font-size:10px}
 .connection{font-size:9px}
 .asset-list{gap:10px}
 .asset{border-radius:12px}
 .asset-head{padding:11px 12px}
 .market-name{font-size:14px}
 .market-price{font-size:11px}
 .table-wrap{overflow:visible}
 table{min-width:0;display:block}
 thead{display:none}
 tbody{display:grid;gap:0}
 tr{display:grid;grid-template-columns:1fr 1fr;gap:0 10px;padding:9px 11px;border-top:1px solid #213044}
 tbody tr:first-child{border-top:0}
 td{display:block;padding:3px 0;border:0;font-size:11px;min-width:0}
 td::before{content:attr(data-label);display:block;font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
 td:first-child{grid-column:1}
 td:last-child{grid-column:2;grid-row:1;justify-self:end;text-align:right}
 .score-track{width:40px}
 .no-trade{padding:17px 12px}
}
</style>
</head>
<body>
<main>
<header>
  <div class="brand">
    <div class="mark">AST</div>
    <div>
      <h1>HIGH-CONFIDENCE MARKET LEVELS</h1>
      <div class="subtitle">Only confirmed support & resistance · BTC / GOLD</div>
    </div>
  </div>
  <div class="connection"><span id="dot" class="dot"></span><span id="connectionText">Connecting…</span></div>
</header>
<section id="assetList" class="asset-list">
  <div class="loading">Loading confirmed market levels…</div>
</section>
<footer>BUY / SELL requires 5M + 1M confirmation and minimum 1:2 risk-reward. No trade is forced.</footer>
</main>
<script>
const root=document.getElementById('assetList');
const dot=document.getElementById('dot');
const connectionText=document.getElementById('connectionText');
const prices={};
let requestBusy=false;
let latestPayload=null;
const digits=asset=>asset==='BTC'?1:3;
const fmt=(value,asset)=>{
  if(value===null||value===undefined||!Number.isFinite(Number(value))) return '—';
  return new Intl.NumberFormat('en-US',{minimumFractionDigits:digits(asset),maximumFractionDigits:digits(asset)}).format(Number(value));
};
const esc=value=>String(value??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#39;");
const statusClass=value=>value==='BUY'?'buy':value==='SELL'?'sell':'wait';
function render(payload){
  latestPayload=payload;
  const assets=payload?.assets||[];
  if(!assets.length){root.innerHTML='<div class="loading">Waiting for market data…</div>';return;}
  root.innerHTML=assets.map(asset=>{
    const name=asset.asset||'MARKET';
    const price=prices[name]??asset.price;
    const levels=(asset.levels||[]).map(level=>({...level,distance:price?Math.abs(Number(price)-Number(level.price)):level.distance}));
    const signal=levels.some(x=>x.status==='BUY')?'BUY':levels.some(x=>x.status==='SELL')?'SELL':'NO TRADE';
    const summaryClass=signal==='BUY'?'buy':signal==='SELL'?'sell':'wait';
    const rows=levels.map(level=>{
      const score=Math.max(0,Math.min(100,Number(level.strength_score)||0));
      const side=level.side==='SUPPORT'?'SUPPORT':'RESISTANCE';
      return '<tr>'
        +'<td data-label="Rank"><span class="rank">#'+esc(level.rank)+'</span></td>'
        +'<td data-label="Support / Resistance"><span class="side '+(side==='SUPPORT'?'support':'resistance')+'">'+side+'</span></td>'
        +'<td data-label="Exact Level Price"><span class="price">'+fmt(level.price,name)+'</span></td>'
        +'<td data-label="Distance"><span class="distance">'+fmt(level.distance,name)+'</span></td>'
        +'<td data-label="Strength Score"><div class="score"><span class="score-num">'+score+'</span><span class="score-track"><span class="score-fill" style="display:block;width:'+score+'%"></span></span></div></td>'
        +'<td data-label="Status"><span class="pill '+statusClass(level.status)+'">'+esc(level.status||'WAITING')+'</span></td>'
        +'</tr>';
    }).join('');
    const empty=(asset.status==='WARMING UP')
      ?'Waiting for enough closed historical candles. No unconfirmed levels are shown.'
      :'NO TRADE · No level currently meets all confirmation rules.';
    return '<article class="asset">'
      +'<div class="asset-head"><div><div class="market-name">'+esc(name)+'</div><div class="market-price">Current price: '+fmt(price,name)+'</div></div>'
      +'<span class="pill '+summaryClass+'">'+signal+'</span></div>'
      +(rows?'<div class="table-wrap"><table><thead><tr><th>Rank</th><th>Support / Resistance</th><th>Exact Level Price</th><th>Distance</th><th>Strength Score</th><th>Status</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
        :'<div class="no-trade">'+empty+'</div>')
      +'</article>';
  }).join('');
}
async function refresh(){
  if(requestBusy) return;
  requestBusy=true;
  try{
    const response=await fetch('/api/levels',{cache:'no-store'});
    if(!response.ok) throw new Error('HTTP '+response.status);
    render(await response.json());
    dot.className='dot live';
    connectionText.textContent='Market levels live';
  }catch(error){
    dot.className='dot off';
    connectionText.textContent='Reconnecting…';
    console.warn('Market levels refresh failed',error);
  }finally{requestBusy=false;}
}
let socket=null;
let reconnectTimer=null;
function connectPrices(){
  if(!('WebSocket' in window)) return;
  if(socket&&(socket.readyState===WebSocket.OPEN||socket.readyState===WebSocket.CONNECTING)) return;
  const scheme=location.protocol==='https:'?'wss:':'ws:';
  socket=new WebSocket(scheme+'//'+location.host+'/ws/prices');
  socket.onmessage=event=>{
    try{
      const packet=JSON.parse(event.data);
      if(packet.type!=='prices') return;
      for(const [asset,item] of Object.entries(packet.assets||{})){
        if(item.price!==null&&item.price!==undefined) prices[asset]=Number(item.price);
      }
      if(latestPayload) render(latestPayload);
    }catch(error){console.warn('Price packet error',error);}
  };
  socket.onclose=()=>{
    socket=null;
    clearTimeout(reconnectTimer);
    reconnectTimer=setTimeout(connectPrices,1500);
  };
  socket.onerror=()=>{try{socket?.close();}catch(error){}};
}
refresh();
setInterval(refresh,2500);
connectPrices();
</script>
</body>
</html>
